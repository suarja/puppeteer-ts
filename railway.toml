[build]
builder = "nixpacks"

[deploy]
# Keep the service alive — it's a long-running HTTP server, not a
# one-shot scraping job like the original template assumed.
restartPolicyType = "on_failure"
healthcheckPath = "/health"
healthcheckTimeout = 30

[env]
NODE_ENV = "production"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PUPPETEER_EXECUTABLE_PATH = "/usr/bin/google-chrome-stable"

[build.args]
NODE_VERSION = "20"

[build.nixpacks]
cmd = "npm run build && npm prune --production"

